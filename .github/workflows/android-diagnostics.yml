name: Android installation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      APK_PATH: downloads/v1.0.4-alpha.1/OcheClub-1.0.4-preview.apk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify snapshot checksums
        working-directory: downloads/v1.0.4-alpha.1
        run: sha256sum --check SHA256SUMS.txt
      - name: Install Android build tools
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;35.0.0'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the Preview APK
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: node scripts/android-smoke.mjs
      - name: Keep native diagnostic files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-install-diagnostics-API${{ matrix.api }}
          path: |
            artifacts/android-*.txt
            artifacts/android-*.png
          if-no-files-found: ignore
